name: otlobha_customer
description: "اطلبها – Otlobha Customer App (Android & iOS) for El Manzala"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.2.2
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  intl: any
  image_picker: ^1.1.2
  web_socket_channel: ^3.0.1
  geolocator: ^13.0.1
  firebase_core: ^3.12.1
  firebase_messaging: ^15.2.4
  flutter_local_notifications: ^18.0.1
  shared_preferences: ^2.3.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/otlobha_logo.jpg"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/otlobha_logo.jpg"

flutter:
  uses-material-design: true
  assets:
    - assets/images/otlobha_logo.jpg
