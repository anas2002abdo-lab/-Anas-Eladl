name: Build Otlobha Android & iOS Apps

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "Backend API Base URL"
        required: true
        default: "https://ais-dev-xcfo2sxsvz6eimo6tdzhrg-565346403151.europe-west2.run.app"
  push:
    paths:
      - "mobile/**"

jobs:
  build_android_apks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"

      - name: Prepare & Build Otlobha Customer APK
        run: |
          cd mobile/otlobha_customer
          cp android/app/src/main/AndroidManifest.xml /tmp/cust_manifest.xml
          cp ios/Runner/Info.plist /tmp/cust_info.plist
          flutter create . --platforms=android,ios
          cp /tmp/cust_manifest.xml android/app/src/main/AndroidManifest.xml
          cp /tmp/cust_info.plist ios/Runner/Info.plist
          flutter pub get
          dart run flutter_launcher_icons
          flutter analyze
          flutter build apk --release --dart-define=API_BASE_URL=${{ github.event.inputs.api_base_url || 'https://ais-dev-xcfo2sxsvz6eimo6tdzhrg-565346403151.europe-west2.run.app' }}

      - name: Prepare & Build Otlobha Captain APK
        run: |
          cd mobile/otlobha_captain
          cp android/app/src/main/AndroidManifest.xml /tmp/cap_manifest.xml
          cp ios/Runner/Info.plist /tmp/cap_info.plist
          flutter create . --platforms=android,ios
          cp /tmp/cap_manifest.xml android/app/src/main/AndroidManifest.xml
          cp /tmp/cap_info.plist ios/Runner/Info.plist
          flutter pub get
          dart run flutter_launcher_icons
          flutter analyze
          flutter build apk --release --dart-define=API_BASE_URL=${{ github.event.inputs.api_base_url || 'https://ais-dev-xcfo2sxsvz6eimo6tdzhrg-565346403151.europe-west2.run.app' }}

      - name: Upload Customer APK
        uses: actions/upload-artifact@v4
        with:
          name: otlobha-customer-apk
          path: mobile/otlobha_customer/build/app/outputs/flutter-apk/app-release.apk

      - name: Upload Captain APK
        uses: actions/upload-artifact@v4
        with:
          name: otlobha-captain-apk
          path: mobile/otlobha_captain/build/app/outputs/flutter-apk/app-release.apk

  build_ios_unsigned:
    runs-on: macos-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
      - name: Build Unsigned iOS Runners
        run: |
          for app in otlobha_customer otlobha_captain; do
            cd "$GITHUB_WORKSPACE/mobile/$app"
            cp ios/Runner/Info.plist /tmp/info.plist
            flutter create . --platforms=ios
            cp /tmp/info.plist ios/Runner/Info.plist
            flutter pub get
            dart run flutter_launcher_icons
            flutter build ios --release --no-codesign --dart-define=API_BASE_URL=${{ github.event.inputs.api_base_url || 'https://ais-dev-xcfo2sxsvz6eimo6tdzhrg-565346403151.europe-west2.run.app' }}
          done
