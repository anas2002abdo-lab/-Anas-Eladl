name: Build Otlobha Android & iOS Apps

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "Public Backend API Base URL (e.g. https://otlobha-backend-xxxx.a.run.app)"
        required: false
        default: ""
  push:
    paths:
      - "mobile/**"
      - ".github/workflows/build_mobile_apps.yml"

jobs:
  build_android_apks:
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: "-Dorg.gradle.vfs.watch=false"
    steps:
      - uses: actions/checkout@v4

      - name: Verify Required Firebase Android Secrets
        env:
          CUSTOMER_FIREBASE_B64: ${{ secrets.FIREBASE_CUSTOMER_GOOGLE_SERVICES_JSON_B64 }}
          CAPTAIN_FIREBASE_B64: ${{ secrets.FIREBASE_CAPTAIN_GOOGLE_SERVICES_JSON_B64 }}
        run: |
          set -euo pipefail
          MISSING=0
          if [ -z "${CUSTOMER_FIREBASE_B64//[$' \t\r\n']/}" ]; then
            echo "::error::Missing GitHub Secret FIREBASE_CUSTOMER_GOOGLE_SERVICES_JSON_B64 (required to generate mobile/otlobha_customer/android/app/google-services.json)."
            MISSING=1
          fi
          if [ -z "${CAPTAIN_FIREBASE_B64//[$' \t\r\n']/}" ]; then
            echo "::error::Missing GitHub Secret FIREBASE_CAPTAIN_GOOGLE_SERVICES_JSON_B64 (required to generate mobile/otlobha_captain/android/app/google-services.json)."
            MISSING=1
          fi
          if [ "$MISSING" -ne 0 ]; then
            echo "::error::Stopping Android build because one or more required Firebase Android secrets are missing."
            exit 1
          fi
          echo "Verified FIREBASE_CUSTOMER_GOOGLE_SERVICES_JSON_B64 and FIREBASE_CAPTAIN_GOOGLE_SERVICES_JSON_B64 are set (values hidden)."

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Set up Flutter (Stable)
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Configure & Verify Toolchain Versions
        run: |
          java -version
          flutter config --jdk-dir="$JAVA_HOME"
          flutter --version

      - name: Prepare & Build Otlobha Customer APK
        env:
          FIREBASE_GOOGLE_SERVICES_JSON_B64: ${{ secrets.FIREBASE_CUSTOMER_GOOGLE_SERVICES_JSON_B64 }}
          FIREBASE_SECRET_NAME: "FIREBASE_CUSTOMER_GOOGLE_SERVICES_JSON_B64"
          EXPECTED_ANDROID_PACKAGE: "com.otlobha.otlobha_customer"
          REQUIRE_GOOGLE_SERVICES: "1"
        run: |
          set -euo pipefail
          cd mobile/otlobha_customer

          if [ ! -f android/settings.gradle ] && [ ! -f android/settings.gradle.kts ]; then
            if [ -f android/app/src/main/AndroidManifest.xml ]; then cp android/app/src/main/AndroidManifest.xml /tmp/cust_manifest.xml; fi
            if [ -f android/app/google-services.json ]; then cp android/app/google-services.json /tmp/cust_google_services.json; fi
            if [ -f ios/Runner/Info.plist ]; then cp ios/Runner/Info.plist /tmp/cust_info.plist; fi
            if [ -d test ]; then rm -rf /tmp/cust_test && cp -r test /tmp/cust_test; fi
            if [ -f analysis_options.yaml ]; then cp analysis_options.yaml /tmp/cust_analysis_options.yaml; fi

            flutter create . --project-name otlobha_customer --org com.otlobha --platforms=android,ios

            if [ -f /tmp/cust_manifest.xml ]; then cp /tmp/cust_manifest.xml android/app/src/main/AndroidManifest.xml; fi
            if [ -f /tmp/cust_google_services.json ]; then cp /tmp/cust_google_services.json android/app/google-services.json; fi
            if [ -f /tmp/cust_info.plist ]; then cp /tmp/cust_info.plist ios/Runner/Info.plist; fi
            if [ -d /tmp/cust_test ]; then
              rm -rf test
              cp -r /tmp/cust_test test
            fi
            if [ -f /tmp/cust_analysis_options.yaml ]; then cp /tmp/cust_analysis_options.yaml analysis_options.yaml; fi
          fi

          bash ../configure_firebase_android.sh .

          if [ ! -s android/app/google-services.json ]; then
            echo "::error::mobile/otlobha_customer/android/app/google-services.json is missing or empty after Firebase setup."
            exit 1
          fi
          if ! grep -qE 'com\.google\.gms(\.google-services|:google-services)' android/settings.gradle* android/build.gradle* 2>/dev/null || ! grep -q 'com\.google\.gms\.google-services' android/app/build.gradle* 2>/dev/null; then
            echo "::error::Google Services Gradle plugin is not enabled in mobile/otlobha_customer Android Gradle files."
            exit 1
          fi

          if [ -f android/gradle.properties ] && ! grep -q '^org\.gradle\.vfs\.watch=' android/gradle.properties; then
            printf '\norg.gradle.vfs.watch=false\n' >> android/gradle.properties
          fi

          echo "--- Android Gradle / AGP / Kotlin Versions (Customer) ---"
          if [ -f android/gradle/wrapper/gradle-wrapper.properties ]; then grep -E 'distributionUrl' android/gradle/wrapper/gradle-wrapper.properties || true; fi
          if [ -f android/settings.gradle.kts ]; then grep -E 'com\.android\.application|org\.jetbrains\.kotlin\.android|google-services' android/settings.gradle.kts || true; fi
          if [ -f android/settings.gradle ]; then grep -E 'com\.android\.application|org\.jetbrains\.kotlin\.android|google-services' android/settings.gradle || true; fi

          flutter pub get
          dart run flutter_launcher_icons
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter test
          RESOLVED_API_URL="${{ github.event.inputs.api_base_url || vars.OTLOBHA_API_BASE_URL || 'https://ais-dev-xcfo2sxsvz6eimo6tdzhrg-565346403151.europe-west2.run.app' }}"
          echo "Using Customer API_BASE_URL=$RESOLVED_API_URL"
          if echo "$RESOLVED_API_URL" | grep -qE 'ais-dev-|ais-pre-'; then
            echo "::warning::API_BASE_URL points to an AI Studio preview URL protected by Cookie Check. Set repository variable OTLOBHA_API_BASE_URL to your public Cloud Run URL."
          fi
          flutter build apk --release --dart-define="API_BASE_URL=$RESOLVED_API_URL"

          test -s build/app/outputs/flutter-apk/app-release.apk
          ls -lh build/app/outputs/flutter-apk/app-release.apk
          if [ -x android/gradlew ]; then (cd android && ./gradlew --stop) || true; fi

      - name: Print Signed Customer APK SHA-1 & SHA-256 (Diagnostic)
        run: |
          set -euo pipefail
          APK_PATH="mobile/otlobha_customer/build/app/outputs/flutter-apk/app-release.apk"
          test -s "$APK_PATH"

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -maxdepth 2 -type f -name apksigner 2>/dev/null | sort -V | tail -n 1)"
          if [ -z "$APKSIGNER" ] || [ ! -x "$APKSIGNER" ]; then
            echo "::error::apksigner not found under Android SDK build-tools ($SDK_ROOT/build-tools)."
            exit 1
          fi

          CERTS_OUT="$("$APKSIGNER" verify --print-certs "$APK_PATH")"
          SHA1_HEX="$(printf '%s\n' "$CERTS_OUT" | sed -nE 's/.*certificate SHA-1 digest:[[:space:]]*([0-9a-fA-F]+).*/\1/p' | head -n 1)"
          SHA256_HEX="$(printf '%s\n' "$CERTS_OUT" | sed -nE 's/.*certificate SHA-256 digest:[[:space:]]*([0-9a-fA-F]+).*/\1/p' | head -n 1)"

          if [ -z "$SHA1_HEX" ] || [ -z "$SHA256_HEX" ]; then
            echo "::error::Failed to extract SHA-1/SHA-256 signing fingerprints from $APK_PATH."
            exit 1
          fi

          SHA1_FMT="$(printf '%s' "$SHA1_HEX" | tr '[:lower:]' '[:upper:]' | sed 's/../&:/g; s/:$//')"
          SHA256_FMT="$(printf '%s' "$SHA256_HEX" | tr '[:lower:]' '[:upper:]' | sed 's/../&:/g; s/:$//')"
          echo "SHA-1: $SHA1_FMT"
          echo "SHA-256: $SHA256_FMT"

      - name: Prepare & Build Otlobha Captain APK
        env:
          FIREBASE_GOOGLE_SERVICES_JSON_B64: ${{ secrets.FIREBASE_CAPTAIN_GOOGLE_SERVICES_JSON_B64 }}
          FIREBASE_SECRET_NAME: "FIREBASE_CAPTAIN_GOOGLE_SERVICES_JSON_B64"
          EXPECTED_ANDROID_PACKAGE: "com.otlobha.otlobha_captain"
          REQUIRE_GOOGLE_SERVICES: "1"
        run: |
          set -euo pipefail
          cd mobile/otlobha_captain

          if [ ! -f android/settings.gradle ] && [ ! -f android/settings.gradle.kts ]; then
            if [ -f android/app/src/main/AndroidManifest.xml ]; then cp android/app/src/main/AndroidManifest.xml /tmp/cap_manifest.xml; fi
            if [ -f android/app/google-services.json ]; then cp android/app/google-services.json /tmp/cap_google_services.json; fi
            if [ -f ios/Runner/Info.plist ]; then cp ios/Runner/Info.plist /tmp/cap_info.plist; fi
            if [ -d test ]; then rm -rf /tmp/cap_test && cp -r test /tmp/cap_test; fi
            if [ -f analysis_options.yaml ]; then cp analysis_options.yaml /tmp/cap_analysis_options.yaml; fi

            flutter create . --project-name otlobha_captain --org com.otlobha --platforms=android,ios

            if [ -f /tmp/cap_manifest.xml ]; then cp /tmp/cap_manifest.xml android/app/src/main/AndroidManifest.xml; fi
            if [ -f /tmp/cap_google_services.json ]; then cp /tmp/cap_google_services.json android/app/google-services.json; fi
            if [ -f /tmp/cap_info.plist ]; then cp /tmp/cap_info.plist ios/Runner/Info.plist; fi
            if [ -d /tmp/cap_test ]; then
              rm -rf test
              cp -r /tmp/cap_test test
            fi
            if [ -f /tmp/cap_analysis_options.yaml ]; then cp /tmp/cap_analysis_options.yaml analysis_options.yaml; fi
          fi

          bash ../configure_firebase_android.sh .

          if [ ! -s android/app/google-services.json ]; then
            echo "::error::mobile/otlobha_captain/android/app/google-services.json is missing or empty after Firebase setup."
            exit 1
          fi
          if ! grep -qE 'com\.google\.gms(\.google-services|:google-services)' android/settings.gradle* android/build.gradle* 2>/dev/null || ! grep -q 'com\.google\.gms\.google-services' android/app/build.gradle* 2>/dev/null; then
            echo "::error::Google Services Gradle plugin is not enabled in mobile/otlobha_captain Android Gradle files."
            exit 1
          fi

          if [ -f android/gradle.properties ] && ! grep -q '^org\.gradle\.vfs\.watch=' android/gradle.properties; then
            printf '\norg.gradle.vfs.watch=false\n' >> android/gradle.properties
          fi

          echo "--- Android Gradle / AGP / Kotlin Versions (Captain) ---"
          if [ -f android/gradle/wrapper/gradle-wrapper.properties ]; then grep -E 'distributionUrl' android/gradle/wrapper/gradle-wrapper.properties || true; fi
          if [ -f android/settings.gradle.kts ]; then grep -E 'com\.android\.application|org\.jetbrains\.kotlin\.android|google-services' android/settings.gradle.kts || true; fi
          if [ -f android/settings.gradle ]; then grep -E 'com\.android\.application|org\.jetbrains\.kotlin\.android|google-services' android/settings.gradle || true; fi

          flutter pub get
          dart run flutter_launcher_icons
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter test
          RESOLVED_API_URL="${{ github.event.inputs.api_base_url || vars.OTLOBHA_API_BASE_URL || 'https://ais-dev-xcfo2sxsvz6eimo6tdzhrg-565346403151.europe-west2.run.app' }}"
          echo "Using Captain API_BASE_URL=$RESOLVED_API_URL"
          if echo "$RESOLVED_API_URL" | grep -qE 'ais-dev-|ais-pre-'; then
            echo "::warning::API_BASE_URL points to an AI Studio preview URL protected by Cookie Check. Set repository variable OTLOBHA_API_BASE_URL to your public Cloud Run URL."
          fi
          flutter build apk --release --dart-define="API_BASE_URL=$RESOLVED_API_URL"

          test -s build/app/outputs/flutter-apk/app-release.apk
          ls -lh build/app/outputs/flutter-apk/app-release.apk
          if [ -x android/gradlew ]; then (cd android && ./gradlew --stop) || true; fi

      - name: Upload Customer APK
        uses: actions/upload-artifact@v4
        with:
          name: otlobha-customer-apk
          path: mobile/otlobha_customer/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Upload Captain APK
        uses: actions/upload-artifact@v4
        with:
          name: otlobha-captain-apk
          path: mobile/otlobha_captain/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  build_ios_unsigned:
    runs-on: macos-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true
      - name: Build Unsigned iOS Runners
        run: |
          set -euo pipefail
          for app in otlobha_customer otlobha_captain; do
            cd "$GITHUB_WORKSPACE/mobile/$app"
            if [ ! -d ios/Runner.xcodeproj ]; then
              if [ -f ios/Runner/Info.plist ]; then cp ios/Runner/Info.plist /tmp/info.plist; fi
              if [ -d test ]; then rm -rf /tmp/app_test && cp -r test /tmp/app_test; fi
              if [ -f analysis_options.yaml ]; then cp analysis_options.yaml /tmp/analysis_options.yaml; fi

              flutter create . --project-name "$app" --org com.otlobha --platforms=ios

              if [ -f /tmp/info.plist ]; then cp /tmp/info.plist ios/Runner/Info.plist; fi
              if [ -d /tmp/app_test ]; then
                rm -rf test
                cp -r /tmp/app_test test
              fi
              if [ -f /tmp/analysis_options.yaml ]; then cp /tmp/analysis_options.yaml analysis_options.yaml; fi
            fi
            flutter pub get
            dart run flutter_launcher_icons
            RESOLVED_API_URL="${{ github.event.inputs.api_base_url || vars.OTLOBHA_API_BASE_URL || 'https://ais-dev-xcfo2sxsvz6eimo6tdzhrg-565346403151.europe-west2.run.app' }}"
            flutter build ios --release --no-codesign --dart-define="API_BASE_URL=$RESOLVED_API_URL"
          done
