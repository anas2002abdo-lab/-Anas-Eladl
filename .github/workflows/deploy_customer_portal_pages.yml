name: Deploy Isolated Customer Portal (GitHub Pages - Zero GCP Needed)

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "Public Backend API Base URL (optional; defaults to Repository Variable OTLOBHA_API_BASE_URL)"
        required: false
        default: ""
  push:
    branches: ["main"]
    paths:
      - "docs/**"
      - ".github/workflows/deploy_customer_portal_pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy_customer_portal_pages:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Inject Public API Base URL into Isolated Customer Portal
        env:
          API_BASE_URL: ${{ github.event.inputs.api_base_url || vars.OTLOBHA_API_BASE_URL || '' }}
        run: |
          set -euo pipefail
          CLEAN_URL="${API_BASE_URL%/}"
          cat > docs/config.js <<EOF
          window.OTLOBHA_PORTAL_CONFIG = {
            apiBaseUrl: "${CLEAN_URL}"
          };
          EOF
          echo "Configured docs/config.js with apiBaseUrl=${CLEAN_URL:-<empty>}"

      - name: Upload Isolated Customer Portal Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Print Dedicated Customer Portal URL
        run: |
          PORTAL_URL="${{ steps.deployment.outputs.page_url }}"
          PORTAL_URL="${PORTAL_URL%/}"
          {
            echo "## Dedicated Isolated Customer Portal (GitHub Pages — Zero GCP Permissions Needed)"
            echo ""
            echo "**Customer Portal URL:** \`${PORTAL_URL}\`"
            echo "- Verify Email Page: \`${PORTAL_URL}/verify-email.html\`"
            echo "- Forgot Password Page: \`${PORTAL_URL}/forgot-password.html\`"
            echo "- Completely isolated from the Admin Dashboard (runs on github.io with zero admin files)."
            echo ""
            echo "### Connect to Customer APK"
            echo "Set GitHub Repository Variable \`OTLOBHA_CUSTOMER_PORTAL_URL\` to \`${PORTAL_URL}\`, then run **Build Otlobha Android & iOS Apps**."
          } >> "$GITHUB_STEP_SUMMARY"
